# Rust's equivalent of package.json: lists what the native wrapper needs.
[package]
name = "threadline"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"   # native pop-ups like "Are you sure?"
tauri-plugin-fs = "2"   # lets the web page read/write files (see capabilities/default.json)
tauri-plugin-notification = "2"   # local macOS notifications for Signals flags (no network)
tauri-plugin-opener = "2"   # opens links from replies in your normal browser
