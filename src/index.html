<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threadline</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Left column: list of saved chats -->
  <aside class="sidebar">
    <button id="new-chat" class="new-chat">+ New chat</button>
    <nav id="conversation-list"></nav>
  </aside>

  <!-- Right column: the current chat -->
  <main class="chat">
    <!-- Top bar: chat title + the list of files attached in this chat -->
    <header class="chat-header">
      <h1 id="chat-title"></h1>
      <button id="files-button" class="files-button" hidden></button>
    </header>
    <div id="files-panel" class="files-panel" hidden></div>

    <div id="messages" class="messages"></div>

    <form id="composer" class="composer">
      <div id="attachment-chip" class="attachment-chip" hidden></div>
      <div class="composer-row">
        <!-- The real file picker is hidden; the 📎 label opens it. -->
        <label class="attach-button" title="Attach a .txt or .pdf file">
          📎
          <input id="file-input" type="file" accept=".txt,.md,.csv,.json,.log,.pdf,text/*,application/pdf" hidden />
        </label>
        <textarea id="message-input" rows="1" placeholder="Message Threadline…  (Shift+Enter for a new line)" autofocus></textarea>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
  </main>

  <!-- Pop-up that shows the text extracted from an attached file -->
  <dialog id="file-viewer" class="file-viewer">
    <header>
      <h2 id="file-viewer-title"></h2>
      <button id="file-viewer-close" title="Close">×</button>
    </header>
    <p id="file-viewer-note" class="file-viewer-note"></p>
    <pre id="file-viewer-text"></pre>
  </dialog>

  <!-- type="module" lets our JS files import each other -->
  <script type="module" src="app.js"></script>
</body>
</html>
